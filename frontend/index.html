<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turf Booking System</title>
  <link rel="stylesheet" href="index.css" />
  <!-- Google Fonts for a modern look -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <script src="index.js" defer></script>
</head>

<body>
  <div class="container">
    <h1>Turf Booking Portal</h1>
    <div class="role-switch">
      <label for="role-select"><strong>Switch Role:</strong></label>
      <select id="role-select" onchange="switchRole()">
        <option value="user">User / Player</option>
        <option value="admin">Admin / Turf Owner</option>
      </select>
    </div>
    <!-- User Section -->
    <div id="user-section">
      <h2> Player Dashboard</h2>
     
      <form class="login-form">
        <div id="login-block">
        <div id="name">Name:<input type="text" id="i-name" value="Enter name"></div>
        <div id="email">Email:<input type="email" id="i-email" value="Enter email"></div>
        <div id="phone">Monile no.:<input type="text" id="i-num" value="Enter number"></div>
      </div>
      </form>
   

      <h2>👤 Player Dashboard</h2>
      <form class="booking-form" onsubmit="event.preventDefault(); bookSlot();">
        <select id="turf-select"></select>
        <input type="date" id="booking-date" />
        <select id="time-slot">
          <option value="6AM-7AM">6AM-7AM</option>
          <option value="7AM-8AM">7AM-8AM</option>
          <option value="8AM-9AM">8AM-9AM</option>
          <option value="5PM-6PM">5PM-6PM</option>
        </select>
        <button type="submit">Book Slot</button>
      </form>
      <div class="tabs">
        <button class="tab-btn active" onclick="switchBookingTab('upcoming')">Upcoming</button>
        <button class="tab-btn" onclick="switchBookingTab('past')">Past</button>
      </div>
      <ul id="booking-list" class="booking-list"></ul>
    </div>
    <!-- Admin Section -->
    <div id="admin-section" style="display: none;">
      <h2>🛠 Admin Dashboard</h2>
      <form class="admin-add-form" onsubmit="event.preventDefault(); addTurf();">
        <input type="text" id="turf-name" placeholder="Turf Name" />
        <input type="text" id="turf-location" placeholder="Location" />
        <input type="number" id="turf-price" placeholder="Price per hour" />
        <button type="submit">Add Turf</button>
      </form>
      <h3>Block Slot</h3>
      <form class="admin-block-form" onsubmit="event.preventDefault(); blockSlot();">
        <select id="block-turf"></select>
        <input type="date" id="block-date" />
        <select id="block-time">
          <option value="6AM-7AM">6AM-7AM</option>
          <option value="7AM-8AM">7AM-8AM</option>
          <option value="8AM-9AM">8AM-9AM</option>
          <option value="5PM-6PM">5PM-6PM</option>
        </select>
        <button type="submit">Block Slot</button>
      </form>
      <h3>Booking Requests</h3>
      <ul id="admin-requests"></ul>
      <h3>
        Booking Calendar
        <select id="calendar-view" onchange="renderCalendar()">
          <option value="weekly">Weekly</option>
          <option value="daily">Daily</option>
        </select>
      </h3>
      <div id="calendar"></div>
    </div>
  </div>
  <script src="index.js"></script>
</body>

</html>
